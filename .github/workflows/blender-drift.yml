name: Blender drift

# Rebuilds the committed GLBs from their Blender scripts with headless Blender
# and fails if they drifted (holodeck#136). The main CI has no Blender, so
# there the rebuild tests skip (`describe.skipIf(!blender)`) and drift between
# blender/parts/**/*.py and the shipped GLBs was only caught on a dev machine.
#
#   library-cloud      src/cloud-glb.test.ts     26 cloud archetypes
#   editor-2.5d-react  src/models/valve-glb.test.ts   valve.glb
#
# Runs on PRs/pushes that touch the scripts, the GLBs or the build tooling,
# weekly (catches a drifting runner image), and on demand. Blender is the
# official Linux build pinned to the version the GLBs are authored with
# (blender/README.md: 5.2.2 LTS), checksum-verified and cached; not apt's,
# which lags and would change the exporter output.
#
# "Drifted": geometry (the GLB BIN chunk) must be byte-identical and the glTF
# JSON equal within 1e-6. Not every byte: the GLBs are authored on macOS arm64
# and Blender's matrix -> quaternion step rounds node rotations 1 float32 ULP
# differently on Linux x86-64 (cdn, valve, fermenter; reproduced in a
# linux/amd64 container). Details: packages/editor-2.5d-react/scripts/glb-compare.mjs.
#
# HOLODECK_REQUIRE_BLENDER=1 turns "no Blender, skip" into a failing test, so
# a broken install cannot leave this job green while checking nothing.

# The "GLBs rebuild from Blender scripts" job is a required check on main (holodeck#209).
# A required check from a path-filtered workflow never reports on PRs that miss the paths and
# would block them forever, so the workflow runs on every PR and the `changes` job decides
# whether the rebuild is needed. A job skipped by `if` counts as passing for required checks.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'blender/**'
      - 'packages/library-cloud/**'
      - 'packages/editor-2.5d-react/assets/models/**'
      - 'packages/editor-2.5d-react/scripts/build-parts.mjs'
      - 'packages/editor-2.5d-react/src/models/**'
      - '.github/workflows/blender-drift.yml'
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BLENDER_VERSION: 5.2.2
  BLENDER_SERIES: '5.2'
  # From https://download.blender.org/release/Blender5.2/blender-5.2.2.sha256
  BLENDER_SHA256: 84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168

jobs:
  changes:
    name: Blender-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      # Push, weekly and manual runs always rebuild. On a PR, rebuild only when the diff
      # against the base touches the same paths the push trigger lists.
      - name: Does this change touch Blender inputs?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # --no-renames: a file moved out of a Blender path must still list its old path.
          changed=$(git diff --no-renames --name-only "$BASE_SHA" HEAD)
          echo "$changed"
          if echo "$changed" | grep -Eq '^(blender/|packages/library-cloud/|packages/editor-2\.5d-react/assets/models/|packages/editor-2\.5d-react/scripts/build-parts\.mjs$|packages/editor-2\.5d-react/src/models/|\.github/workflows/blender-drift\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No Blender inputs changed; the rebuild job is skipped (and counts as passing)."
          fi

  rebuild:
    name: GLBs rebuild from Blender scripts
    needs: changes
    # Fail closed: skip only when `changes` succeeded and said `false`. If `changes` itself failed
    # its output is empty, so the rebuild runs anyway instead of a skip passing the required check.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout holodeck
        uses: actions/checkout@v4
        with:
          path: holodeck

      # Same SDK ref rule as ci.yml (paired branch, pinned .github/holodeck-sdk-ref, else main).
      - name: Pick holodeck-sdk ref
        id: sdk
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          remote=https://github.com/hyperdrive-technology/holodeck-sdk.git
          pinned=$(tr -d '[:space:]' < holodeck/.github/holodeck-sdk-ref 2>/dev/null || true)
          ref=main
          for candidate in "$BRANCH" "$pinned"; do
            if [ -n "$candidate" ] && git ls-remote --exit-code --heads "$remote" "$candidate" >/dev/null; then
              ref=$candidate
              break
            fi
          done
          echo "Using holodeck-sdk ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout holodeck-sdk (${{ steps.sdk.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: hyperdrive-technology/holodeck-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: holodeck-sdk

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version-file: holodeck/.node-version
          cache: pnpm
          cache-dependency-path: |
            holodeck-sdk/ts/pnpm-lock.yaml
            holodeck/packages/library-cloud/pnpm-lock.yaml
            holodeck/packages/editor-2.5d-react/pnpm-lock.yaml

      - name: Cache Blender ${{ env.BLENDER_VERSION }}
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64-${{ env.BLENDER_SHA256 }}

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors -o "/tmp/$file" \
            "https://download.blender.org/release/Blender${BLENDER_SERIES}/$file"
          echo "${BLENDER_SHA256}  /tmp/$file" | sha256sum -c -
          mkdir -p ~/blender
          tar -xJf "/tmp/$file" -C ~/blender --strip-components=1
          rm "/tmp/$file"

      # Background mode (-b) renders nothing, but the binary still links the
      # X11/GL client libraries, which the minimal runner image may lack.
      - name: Blender runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libglx-mesa0
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
          echo "HOLODECK_REQUIRE_BLENDER=1" >> "$GITHUB_ENV"

      - name: Blender version
        run: |
          "$BLENDER" -b --factory-startup --version | tee /tmp/blender-version
          grep -q "Blender ${BLENDER_VERSION}" /tmp/blender-version

      - name: Build holodeck-sdk
        working-directory: holodeck-sdk/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: library-cloud rebuild check
        working-directory: holodeck/packages/library-cloud
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/cloud-glb.test.ts

      - name: editor-2.5d-react rebuild check
        working-directory: holodeck/packages/editor-2.5d-react
        env:
          HOLODECK_SKIP_RENDER_TESTS: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/models/valve-glb.test.ts
