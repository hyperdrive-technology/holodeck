name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # packages/cli is not built here: it has an empty package-lock.json, no
        # src/index.ts (its build entry), and depends on @holodeck/sdk from the npm
        # registry, which is not published. Add it once it is revived.
        package: [editor-2.5d-react, editor-2d-react, viewer-3d-react, flow-runtime]
    env:
      # Render (*-render) tests need a GPU + WebGPU Chromium; hosted runners have
      # neither. src/test-support/chromium.ts skips them when CI is set and
      # HOLODECK_CHROMIUM is not. Set explicitly so the intent is visible here.
      HOLODECK_SKIP_RENDER_TESTS: '1'
    steps:
      # The packages depend on the SDK via `file:../../../holodeck-sdk/ts`, so the
      # SDK must be checked out as a sibling of this repo. Actions can only check
      # out inside $GITHUB_WORKSPACE, so both repos go into subfolders of it.
      - name: Checkout holodeck
        uses: actions/checkout@v4
        with:
          path: holodeck

      # Which SDK ref to test against, first one that exists on the SDK remote:
      #   1. a branch with the same name as this branch (paired PRs);
      #   2. the branch named in .github/holodeck-sdk-ref (for a holodeck branch
      #      that needs unmerged SDK work under a different branch name; once that
      #      SDK branch is merged and deleted this falls through to main, so the
      #      file can be reset to `main` at leisure);
      #   3. main.
      - name: Pick holodeck-sdk ref
        id: sdk
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          remote=https://github.com/hyperdrive-technology/holodeck-sdk.git
          pinned=$(tr -d '[:space:]' < holodeck/.github/holodeck-sdk-ref 2>/dev/null || true)
          ref=main
          for candidate in "$BRANCH" "$pinned"; do
            if [ -n "$candidate" ] && git ls-remote --exit-code --heads "$remote" "$candidate" >/dev/null; then
              ref=$candidate
              break
            fi
          done
          echo "Using holodeck-sdk ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout holodeck-sdk (${{ steps.sdk.outputs.ref }})
        uses: actions/checkout@v4
        with:
          repository: hyperdrive-technology/holodeck-sdk
          ref: ${{ steps.sdk.outputs.ref }}
          path: holodeck-sdk

      # pnpm 10.26+ understands the SDK's pnpm-workspace.yaml (`allowBuilds`).
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      # Node 26 only (repo .node-version; every engines field is >=26).
      - uses: actions/setup-node@v4
        with:
          node-version-file: holodeck/.node-version
          cache: pnpm
          cache-dependency-path: |
            holodeck-sdk/ts/pnpm-lock.yaml
            holodeck/packages/${{ matrix.package }}/pnpm-lock.yaml

      # The SDK's package.json points at dist/, so it has to be built before the
      # `file:` dependency is installed (pnpm copies the folder at install time).
      - name: Build holodeck-sdk
        working-directory: holodeck-sdk/ts
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install
        working-directory: holodeck/packages/${{ matrix.package }}
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: holodeck/packages/${{ matrix.package }}
        run: pnpm type-check

      - name: Test
        working-directory: holodeck/packages/${{ matrix.package }}
        run: pnpm exec vitest run

      - name: Build
        working-directory: holodeck/packages/${{ matrix.package }}
        run: pnpm build

      # Load the built dist/ by package name in plain Node, as both ESM and CJS,
      # and (editor-2.5d-react) check every bundled GLB URL points at a real,
      # published file. Catches holodeck#7-style "builds fine, crashes on import".
      - name: Smoke-test built package
        working-directory: holodeck/packages/${{ matrix.package }}
        run: node ../../scripts/smoke-dist.mjs .

      # Packages that ship a holodeck.package.json: install the built entry into a
      # HolodeckHost through the manifest path (SDK packaging contract, holodeck#15).
      # flow-runtime's script also deploys a small flow through holodeck.flow.local.
      - name: Smoke-test the Holodeck package entry
        if: matrix.package == 'editor-2.5d-react' || matrix.package == 'flow-runtime'
        working-directory: holodeck/packages/${{ matrix.package }}
        run: node --no-deprecation scripts/smoke-holodeck-package.mjs

      # editor-2.5d-react only: consume the built package from a throwaway Vite app
      # in real Chromium and fetch every GLB URL (holodeck#28: Vite dev pre-bundling
      # rewrites them to 404s unless optimizeDeps.exclude is set). No GPU needed.
      - name: Use the runner's preinstalled Chrome for the Vite consumer check
        if: matrix.package == 'editor-2.5d-react'
        # `playwright install chromium` downloads in ~1 s but then hangs while unpacking on the hosted
        # runner (twice with --with-deps, once without; 2026-10-14). GitHub's ubuntu images ship
        # Google Chrome, so point the check at it via HOLODECK_CHROMIUM (scripts/vite-consumer-check.mjs).
        timeout-minutes: 2
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME" || { echo "No preinstalled Chrome found on the runner" >&2; exit 1; }
          "$CHROME" --version
          echo "HOLODECK_CHROMIUM=$CHROME" >> "$GITHUB_ENV"
      - name: Vite consumer check (GLB URLs resolve)
        if: matrix.package == 'editor-2.5d-react'
        working-directory: holodeck/packages/${{ matrix.package }}
        timeout-minutes: 15
        run: pnpm check:vite-consumer
