version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/editor-2.5d-react
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, "area:holodeck"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/editor-2d-react
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, "area:holodeck"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/viewer-3d-react
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, "area:holodeck"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The CLI has a manifest and a package-lock.json, but dependency resolution
  # still needs restoration (see CONTRIBUTING.md). The root has no lockfile.
  - package-ecosystem: npm
    directory: /packages/cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, "area:holodeck"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, "area:ci"]
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
